<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Главная страница</title>
    <style>
        body {
            font-family: 'Times New Roman', serif; /* Шрифт Times New Roman */
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Окно на всю высоту экрана */
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 600px; /* Ширина контейнера */
            width: 100%;
        }

        h1 {
            color: black; /* Черный цвет заголовка */
            font-size: 32px; /* Увеличенный размер шрифта */
            margin-bottom: 20px;
        }

        a {
            display: inline-block;
            margin: 10px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 18px; /* Размер шрифта для ссылок */
            transition: background-color 0.3s ease;
        }

        a:hover {
            background-color: #45a049; /* Изменение цвета при наведении */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Добро пожаловать на главную страницу!</h1>
        <a href="/register">Регистрация</a>
        <a href="/login">Авторизация</a>
    </div>
</body>
</html>
