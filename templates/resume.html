[file content begin]
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Страница создания резюме</title>
    <style>
        body {
            font-family: 'Times New Roman', serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        h1 {
            color: black;
            text-align: center;
            padding: 20px 0;
            background-color: #4CAF50;
            margin: 0;
            color: white;
            font-size: 32px;
        }

        h2 {
            color: black;
            margin-left: 40px;
            font-size: 28px;
        }

        form {
            background-color: white;
            padding: 20px;
            margin: 20px 40px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        label {
            font-weight: bold;
            margin-top: 10px;
            display: block;
            font-size: 18px;
        }

        input[type="text"],
        input[type="tel"],
        input[type="email"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 10px;
            margin: 5px 0 20px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: 'Times New Roman', serif;
            font-size: 16px;
        }

        input[type="text"]:focus,
        input[type="tel"]:focus,
        input[type="email"]:focus,
        input[type="number"]:focus,
        textarea:focus {
            border-color: #4CAF50;
            outline: none;
        }

        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 18px;
            font-family: 'Times New Roman', serif;
            margin: 10px;
        }

        button:hover {
            background-color: #45a049;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .pdf-warning {
            background-color: #fff3cd;
            color: #856404;
            padding: 15px;
            border-radius: 4px;
            margin: 20px auto;
            max-width: 600px;
            text-align: center;
            border: 1px solid #ffeeba;
            display: none;
        }

        .pdf-warning a {
            color: #0056b3;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Создание резюме</h1>
    <div class="pdf-warning" id="pdfWarning">
        Для корректной работы данной функции нужно установить приложение, доступное по ссылке: 
        <a href="https://wkhtmltopdf.org/downloads.html" target="_blank">https://wkhtmltopdf.org/downloads.html</a>
    </div>
    <div class="action-buttons">
        <button onclick="saveResume()">Сохранить резюме</button>
        <a href="/download_pdf"><button onclick="showPdfWarning(event)">Скачать в PDF</button></a>
        <a href="/download_docx"><button>Скачать в Word</button></a>
    </div>
    <div class="container">
        <form id="resumeForm" action="/submit_resume" method="post">
            <!-- Остальная форма остается без изменений -->
            <h2>Основная информация</h2>

            <label>Личные данные</label>
            <input type="text" name="fullname" placeholder="Имя и фамилия" required>
            <input type="text" name="gender" placeholder="Пол">
            <input type="number" name="age" placeholder="Возраст">
            <input type="text" name="city" placeholder="Город проживания">

            <label>Контакты</label>
            <input type="tel" name="phone" placeholder="Номер телефона">
            <input type="email" name="email" placeholder="Электронная почта">
            <input type="text" name="social" placeholder="Ссылка на соцсеть">
            <input type="text" name="messenger" placeholder="Мессенджеры / удобный способ связи">

            <label>Желаемая должность</label>
            <input type="text" name="position" placeholder="Должность">

            <label>Желаемая зарплата</label>
            <input type="text" name="salary" placeholder="Зарплата">

            <label>Образование</label>
            <textarea name="education" placeholder="Название ВУЗа, специальность, годы, формат обучения, курсы и т.д." rows="4"></textarea>

            <label>Опыт работы</label>
            <textarea name="experience" placeholder="Компания, должность, годы, функционал" rows="4"></textarea>

            <label>Профессиональные навыки</label>
            <textarea name="skills" placeholder="Ключевые навыки, знание языков, владение программами" rows="3"></textarea>

            <label>Дополнительная информация</label>
            <textarea name="additional" placeholder="Права, наличие автомобиля, готовность к командировкам и пр." rows="3"></textarea>

            <label>Личные качества</label>
            <input type="text" name="qualities" placeholder="Перечислите до 5 качеств">

            <button type="submit">Отправить резюме</button>
        </form>
    </div>

    <script>
        function saveResume() {
            const formData = new FormData(document.getElementById('resumeForm'));
            const resumeData = {};

            for (let [key, value] of formData.entries()) {
                resumeData[key] = value;
            }

            localStorage.setItem('resumeData', JSON.stringify(resumeData));
            alert('Резюме сохранено!');
        }

        function showPdfWarning(e) {
            e.preventDefault();
            const warning = document.getElementById('pdfWarning');
            warning.style.display = 'block';
            setTimeout(() => {
                window.location.href = e.target.parentElement.href;
            }, 5000);
        }

        // Загрузка сохраненных данных при загрузке страницы
        window.onload = function() {
            const savedData = localStorage.getItem('resumeData');
            if (savedData) {
                const resumeData = JSON.parse(savedData);
                const form = document.getElementById('resumeForm');

                for (const key in resumeData) {
                    if (form.elements[key]) {
                        form.elements[key].value = resumeData[key];
                    }
                }
            }
        };
    </script>
</body>
</html>
